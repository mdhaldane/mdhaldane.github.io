<!-- start custom head snippets -->

<!-- insert favicons. use https://realfavicongenerator.net/ -->

<!-- end custom head snippets -->

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
<link rel="shortcut icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<meta name="msapplication-TileColor" content="#da532c">
<meta name="msapplication-config" content="/browserconfig.xml">
<meta name="theme-color" content="#ffffff">

<style>
    {% if page.header.text_color %}
      .page__hero--overlay .page__title,
      .page__hero--overlay .page__meta,
      .page__hero--overlay .page__lead,
      .page__hero--overlay .btn {
        color: {{page.header.text_color}} !important;
      }
    {% endif %}

    /* IBM 2260 Terminal Theme Overrides */
    body {
      background-color: #101015 !important;
      color: #E8E3D3 !important;
      font-family: 'IBM Plex Mono', monospace !important;
    }

    .masthead, .site-footer, .page__content, .sidebar {
      background-color: #101015 !important;
      color: #E8E3D3 !important;
      font-family: 'IBM Plex Mono', monospace !important;
    }

    h1, h2, h3, h4, h5, h6, .site-title, .archive__subtitle, .archive__item-title, .archive__item-title a {
      color: #D4C5B0 !important;
      font-family: 'IBM Plex Mono', monospace !important;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .page__meta, .page__taxonomy, .page__date {
      color: #D4C5B0 !important;
      opacity: 0.8;
      font-size: 0.8em;
    }

    a {
      color: #D4C5B0 !important;
      text-decoration: underline !important;
    }

    a:hover {
      color: #E8E3D3 !important;
    }

    .btn--primary {
      background-color: #D4C5B0 !important;
      color: #101015 !important;
      border: 1px solid #D4C5B0 !important;
      border-radius: 0 !important;
    }

    .btn--primary:hover {
      background-color: #101015 !important;
      color: #D4C5B0 !important;
      text-decoration: none !important;
    }

    .masthead {
      border-bottom: 1px solid #D4C5B0 !important;
    }

    .masthead__inner-wrap {
      max-width: 100% !important;
      padding-left: 2em;
      padding-right: 2em;
    }

        #main {
      max-width: 90% !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }

    .page {
      width: 100% !important;
      padding-right: 0 !important;
    }

    .greedy-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .site-footer {
      border-top: 1px solid #D4C5B0 !important;
    }

    .masthead__menu-item a {
        color: #E8E3D3 !important;
        font-family: 'IBM Plex Mono', monospace !important;
    }

    /* Sidebars and titles also get the prompt */
    .sidebar .nav__list-item a::before,
    .archive__item-title a::before {
      content: "> " !important;
      color: #D4C5B0 !important;
      margin-right: 5px;
      font-weight: bold;
    }

    /* Hide any text/overlays on the hero image */
    .page__hero--overlay .wrapper {
      display: none !important;
    }
    
    .page__hero--overlay {
      min-height: 300px; /* Increased height to show more of the sprawl */
      background-position: center center !important; /* Prioritize the center of the image */
    }

    /* Feature row icon and text centering fix */
    .feature__wrapper {
      text-align: center !important;
      margin-bottom: 0.5em !important;
    }

    .feature__wrapper .feature__item {
      text-align: center !important;
      margin-bottom: 0.5em !important;
    }

    .feature__wrapper .feature__item-teaser {
      color: #D4C5B0 !important;
      font-size: 4em;
      text-align: center !important;
      margin-bottom: 10px !important;
      display: block !important;
    }

    .feature__wrapper .archive__item-title {
      text-align: center !important;
      margin-bottom: 0.25em !important;
    }

    .feature__wrapper .archive__item-excerpt {
      text-align: center !important;
      margin-bottom: 0.5em !important;
    }

    .feature__wrapper .archive__item-excerpt p {
      margin-bottom: 0.5em !important;
    }

    .feature__item:hover .feature__item-teaser {
      color: #E8E3D3 !important;
      transition: all 0.3s ease;
    }

    /* Uniform size for header icons (About page) */
    h2 img, h3 img {
      height: 32px !important;
      width: auto !important;
      vertical-align: middle;
      margin-right: 10px;
    }
  </style>
